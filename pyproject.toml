[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rmp-mcp"
dynamic = ["version"]
description = "MCP server for Rate My Professors: search, compare and rank professors at any of ~1,400 universities from any MCP client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konstantin Dragovic" }]
keywords = ["mcp", "model-context-protocol", "ratemyprofessors", "professors", "university", "course-registration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6", "bandit[toml]>=1.7", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/Konald58/rmp-mcp"
Repository = "https://github.com/Konald58/rmp-mcp"
Issues = "https://github.com/Konald58/rmp-mcp/issues"
Changelog = "https://github.com/Konald58/rmp-mcp/blob/main/CHANGELOG.md"

[project.scripts]
rmp-mcp = "rmp_mcp.server:main"

[tool.setuptools.dynamic]
version = {attr = "rmp_mcp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=rmp_mcp --cov-report=term-missing --cov-fail-under=80"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
